<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Contactez FitNix, salle de sport ou Maroc."/>
    <title>Contact | FitNix</title>
    <link rel="stylesheet" href="./css/contact.css">
</head>
<body>
<header></header>
    <main>
      <section id="contact">
        <div class="conteneur contact-contenu">
          <div class="contact-infos">
            <p class="contact-surtitre">CONTACT US</p>
            <h1>YOUR FIRST SESSION</h1>
            <h1> IS ON US</h1>
            <p>Book a free trial and 1-on-1 assessment with one of our coaches. No commitment, no pressure</p>

            <div class="contact-info">
              <div>
               
                <p>128 Iron Street, Downtown</p>
              </div>
            </div>

            <div class="contact-info">
              <div>
              
                <p>+1 (555) 014-2290</p>
              </div>
            </div>

            <div class="contact-info">
              <div>
               
                <p>hello@fitnix.com</p>
              </div>
            </div>
          </div>

          <form class="formulaire-contact">
            <p class="contact-titre-menu">BOOK A FREE TRIAL</p>

            <div class="champ">
              <label for="nom-complet"></label>
              <input
                type="text"
                id="nom-complet"
                name="nom_complet"
                placeholder="Full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="champ">
              <label for="email"></label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required
              />
            </div>

            <div class="champ">
              <label for="phone number"></label>
              <input
                type="tel"
                id="telefon"
                name="telefon"
                placeholder="Phone number"
                autocomplete="tel"
                required
              />
           <div class="champ">
            <select name="interest" required>
            <option value="" disabled selected>Interested in...</option>
            <option value="strength">STRENGTH TRAINING</option>
            <option value="cardio">HIIT &amp; CARDIO</option>
            <option value="recomp">BODY RECOMP</option>
            <option value="fitness">FUNCTIONAL FITNESS</option>
            </select>
            </div>
            <div class="champ">
              <label for="message"></label>
              <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Tell us about your goals"
                required
              ></textarea>
            </div>

            <button type="button" class="contact-envoyer">CLAIM FREE TRIAL</button>
        </div>
      </section>
    </main>
    
</body>
</html>
